<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>rilasherif - 3D Love & Live Chat</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&family=Great+Vibes&display=swap" rel="stylesheet">
    <!-- Three.js for 3D Graphics -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- Firebase SDKs for Realtime Online Chat -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Poppins', sans-serif;
            background: #090514;
            color: #ffffff;
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
        }

        #webgl-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            pointer-events: none;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: rgba(20, 15, 38, 0.85);
            backdrop-filter: blur(16px);
            border-radius: 28px;
            box-shadow: 0 20px 50px rgba(255, 42, 117, 0.25);
            overflow: hidden;
            border: 1.5px solid rgba(255, 182, 193, 0.3);
            color: #fff;
            position: relative;
            z-index: 10;
        }

        header {
            background: linear-gradient(135deg, rgba(255, 42, 117, 0.8), rgba(145, 20, 112, 0.8));
            text-align: center;
            padding: 35px 20px;
        }

        header h1 {
            font-family: 'Great Vibes', cursive;
            font-size: 60px;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.9);
        }

        .insta-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            padding: 18px;
            background: rgba(255, 255, 255, 0.05);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .insta-btn {
            padding: 10px 24px;
            background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
            color: #ffffff !important;
            text-decoration: none;
            font-weight: 600;
            border-radius: 30px;
            box-shadow: 0 4px 15px rgba(220, 39, 67, 0.4);
            transition: 0.3s;
        }

        .insta-btn:hover {
            transform: scale(1.05);
        }

        .nav-tabs {
            display: flex;
            background: rgba(0, 0, 0, 0.3);
        }

        .tab-btn {
            flex: 1;
            padding: 16px;
            text-align: center;
            font-weight: 600;
            color: #e0b0ff;
            cursor: pointer;
            border: none;
            background: transparent;
            font-size: 14px;
            transition: 0.3s;
        }

        .tab-btn.active {
            background: rgba(255, 42, 117, 0.3);
            color: #ff7eb3;
            border-bottom: 3px solid #ff2a75;
        }

        .content-section {
            padding: 25px;
            display: none;
        }

        .content-section.active {
            display: block;
        }

        /* LIVE CHAT STYLES */
        .chat-box {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 16px;
            padding: 15px;
        }

        .user-setup {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .user-setup input {
            flex: 1;
            padding: 10px 15px;
            border-radius: 20px;
            border: none;
            outline: none;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
        }

        #messages-container {
            height: 250px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding: 10px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 12px;
            margin-bottom: 15px;
        }

        .msg-bubble {
            max-width: 75%;
            padding: 10px 14px;
            border-radius: 16px;
            font-size: 14px;
            word-wrap: break-word;
        }

        .msg-me {
            align-self: flex-end;
            background: linear-gradient(135deg, #ff2a75, #ff7eb3);
            color: white;
            border-bottom-right-radius: 2px;
        }

        .msg-other {
            align-self: flex-start;
            background: rgba(255, 255, 255, 0.15);
            color: white;
            border-bottom-left-radius: 2px;
        }

        .msg-sender {
            font-size: 10px;
            opacity: 0.8;
            margin-bottom: 3px;
            font-weight: bold;
        }

        .input-area {
            display: flex;
            gap: 10px;
        }

        .input-area input {
            flex: 1;
            padding: 12px 18px;
            border-radius: 25px;
            border: none;
            outline: none;
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
        }

        .input-area button {
            padding: 12px 22px;
            border-radius: 25px;
            border: none;
            background: #ff2a75;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .input-area button:hover {
            background: #ff5252;
        }

        footer {
            text-align: center;
            padding: 15px;
            background: rgba(10, 5, 20, 0.9);
            font-size: 13px;
        }
    </style>
</head>
<body>

<canvas id="webgl-bg"></canvas>

<div class="container">
    <header>
        <h1>rilasherif</h1>
        <p style="letter-spacing:3px; font-size:12px;">3D ROMANTIC JOURNEY</p>
    </header>

    <!-- Verified Instagram Handles -->
    <div class="insta-container">
        <a href="https://instagram.com/sh.xrif" target="_blank" rel="noopener noreferrer" class="insta-btn">
            📸 @sh.xrif
        </a>
        <a href="https://instagram.com/yk.m0i" target="_blank" rel="noopener noreferrer" class="insta-btn">
            📸 @yk.m0i
        </a>
    </div>

    <div class="nav-tabs">
        <button class="tab-btn active" onclick="openTab(event, 'chat')">💬 Live Chat</button>
        <button class="tab-btn" onclick="openTab(event, 'story')">📖 Our Story</button>
    </div>

    <!-- Live Online Chat Tab -->
    <div id="chat" class="content-section active">
        <div class="chat-box">
            <div class="user-setup">
                <label style="line-height:35px; font-size:13px;">Your Name:</label>
                <input type="text" id="usernameInput" value="Rila" placeholder="Enter your name...">
            </div>

            <div id="messages-container"></div>

            <div class="input-area">
                <input type="text" id="messageInput" placeholder="Type a message..." onkeydown="if(event.key==='Enter') sendMessage()">
                <button onclick="sendMessage()">Send 💖</button>
            </div>
        </div>
    </div>

    <!-- Story Tab -->
    <div id="story" class="content-section">
        <div style="background:rgba(255,255,255,0.05); padding:20px; border-radius:12px; border-left:4px solid #ff2a75;">
            <h2 style="color:#ff7eb3; margin-bottom:8px;">Two Hearts, One Journey</h2>
            <p style="line-height:1.7; font-size:14px; color:#e2d9f3;">
                A simple connection turned into deep caring and love. Every conversation brings Rila and Sherif closer together every single day.
            </p>
        </div>
    </div>

    <footer>
        Created with Love for <span style="color:#ff4081;">Rila & Sherif</span>
    </footer>
</div>

<script>
    // Tab Handler
    function openTab(evt, tabName) {
        var i, content, btn;
        content = document.getElementsByClassName("content-section");
        for (i = 0; i < content.length; i++) {
            content[i].style.display = "none";
            content[i].classList.remove("active");
        }
        btn = document.getElementsByClassName("tab-btn");
        for (i = 0; i < btn.length; i++) {
            btn[i].classList.remove("active");
        }
        document.getElementById(tabName).style.display = "block";
        document.getElementById(tabName).classList.add("active");
        evt.currentTarget.classList.add("active");
    }

    // --- FIREBASE REALTIME CHAT SETUP ---
    // Note: Free demo database parameters
    const firebaseConfig = {
        databaseURL: "https://romantic-chat-demo-default-rtdb.firebaseio.com"
    };
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();
    const chatRef = database.ref("messages");

    function sendMessage() {
        const username = document.getElementById("usernameInput").value.trim() || "Anonymous";
        const message = document.getElementById("messageInput").value.trim();

        if (message !== "") {
            chatRef.push({
                sender: username,
                text: message,
                timestamp: Date.now()
            });
            document.getElementById("messageInput").value = "";
        }
    }

    // Listen to live messages online
    chatRef.limitToLast(30).on("child_added", (snapshot) => {
        const data = snapshot.val();
        const myName = document.getElementById("usernameInput").value.trim();
        const container = document.getElementById("messages-container");

        const msgDiv = document.createElement("div");
        const isMe = data.sender === myName;
        msgDiv.className = `msg-bubble ${isMe ? 'msg-me' : 'msg-other'}`;

        msgDiv.innerHTML = `
            <div class="msg-sender">${data.sender}</div>
            <div>${data.text}</div>
        `;

        container.appendChild(msgDiv);
        container.scrollTop = container.scrollHeight;
    });

    // --- THREE.JS 3D BACKGROUND ---
    const canvas = document.getElementById('webgl-bg');
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ canvas: canvas, alpha: true, antialias: true });

    renderer.setSize(window.innerWidth, window.innerHeight);
    camera.position.z = 30;

    // 3D Particles
    const geometry = new THREE.BufferGeometry();
    const count = 300;
    const positions = new Float32Array(count * 3);

    for(let i=0; i<count*3; i++) {
        positions[i] = (Math.random() - 0.5) * 80;
    }
    geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

    const material = new THREE.PointsMaterial({ color: 0xff2a75, size: 0.8 });
    const points = new THREE.Points(geometry, material);
    scene.add(points);

    function animate() {
        requestAnimationFrame(animate);
        points.rotation.y += 0.002;
        points.rotation.x += 0.001;
        renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
</script>

</body>
</html>
