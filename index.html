<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp Web - Global Phone Chat</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: #111b21; color: #e9edef; display: flex; justify-content: center; align-items: center; height: 100vh; }
        
        .app-container { width: 100%; max-width: 450px; height: 100vh; max-height: 850px; background-color: #111b21; border: 1px solid #222d34; display: flex; flex-direction: column; position: relative; border-radius: 12px; overflow: hidden; }

        /* AUTH SCREEN */
        .auth-screen { position: absolute; inset: 0; background-color: #111b21; z-index: 10; display: flex; flex-direction: column; justify-content: center; padding: 30px; text-align: center; }
        .auth-screen h2 { color: #00a884; margin-bottom: 8px; font-size: 22px; }
        .auth-screen p { color: #8696a0; font-size: 13px; margin-bottom: 24px; }
        
        .phone-input-group { display: flex; gap: 8px; margin-bottom: 16px; }
        .country-select { background: #202c33; color: #e9edef; border: 1px solid #2a3942; border-radius: 8px; padding: 12px; font-size: 14px; outline: none; }
        .phone-input { flex: 1; background: #202c33; color: #e9edef; border: 1px solid #2a3942; border-radius: 8px; padding: 12px; font-size: 14px; outline: none; }
        
        .btn-green { background: #00a884; color: #111b21; border: none; padding: 14px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 15px; width: 100%; }
        .btn-green:hover { background: #029071; }

        .otp-box { display: none; margin-top: 15px; }
        .otp-input { width: 100%; background: #202c33; border: 1px solid #00a884; color: #fff; padding: 12px; border-radius: 8px; text-align: center; font-size: 18px; letter-spacing: 5px; margin-bottom: 12px; outline: none; }

        /* CHAT SCREEN */
        .chat-screen { display: flex; flex-direction: column; height: 100%; }
        .chat-header { background: #202c33; height: 60px; display: flex; align-items: center; padding: 0 16px; gap: 12px; border-bottom: 1px solid #222d34; }
        .avatar { width: 40px; height: 40px; border-radius: 50%; background: #6b7c85; display: flex; align-items: center; justify-content: center; font-weight: bold; }
        .header-info { flex: 1; }
        .header-name { font-size: 15px; font-weight: 600; }
        .header-status { font-size: 11px; color: #00a884; }

        .chat-body { flex: 1; background: #0b141a; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
        .msg { max-width: 75%; padding: 8px 12px; border-radius: 8px; font-size: 14px; line-height: 1.4; word-break: break-word; position: relative; }
        .msg.sent { background: #005c4b; align-self: flex-end; border-top-right-radius: 0; }
        .msg.received { background: #202c33; align-self: flex-start; border-top-left-radius: 0; }
        .msg-time { font-size: 10px; color: #8696a0; text-align: right; margin-top: 4px; }

        .chat-footer { background: #202c33; padding: 10px 16px; display: flex; align-items: center; gap: 10px; }
        .chat-footer input { flex: 1; background: #2a3942; border: none; color: #e9edef; padding: 11px 16px; border-radius: 8px; font-size: 14px; outline: none; }
        .send-icon { background: #00a884; border: none; width: 40px; height: 40px; border-radius: 50%; color: #111b21; cursor: pointer; display: flex; align-items: center; justify-content: center; font-weight: bold; }
    </style>
</head>
<body>

<div class="app-container">
    <!-- AUTH SCREEN -->
    <div class="auth-screen" id="authScreen">
        <h2>WhatsApp</h2>
        <p>Enter your phone number to verify your account globally.</p>

        <div class="phone-input-group">
            <select class="country-select" id="countryCode">
                <option value="+94">🇱🇰 +94</option>
                <option value="+91">🇮🇳 +91</option>
                <option value="+971">🇦🇪 +971</option>
                <option value="+1">🇺🇸 +1</option>
                <option value="+44">🇬🇧 +4UK</option>
            </select>
            <input type="tel" class="phone-input" id="phoneNum" placeholder="Mobile Number">
        </div>

        <button class="btn-green" id="sendOtpBtn" onclick="sendOTP()">Request OTP</button>

        <div class="otp-box" id="otpBox">
            <input type="text" class="otp-input" id="otpInput" maxlength="6" placeholder="0 0 0 0 0 0">
            <button class="btn-green" onclick="verifyOTP()">Verify & Login</button>
        </div>
    </div>

    <!-- MAIN CHAT SCREEN -->
    <div class="chat-screen">
        <div class="chat-header">
            <div class="avatar">WA</div>
            <div class="header-info">
                <div class="header-name" id="userDisplay">Global Chat Room</div>
                <div class="header-status">online</div>
            </div>
        </div>

        <div class="chat-body" id="chatBody">
            <div class="msg received">
                Welcome to WhatsApp Web Global! Enter your mobile number to test the interface.
                <div class="msg-time">12:00 PM</div>
            </div>
        </div>

        <div class="chat-footer">
            <input type="text" id="msgInput" placeholder="Type a message" onkeydown="if(event.key==='Enter') sendMsg()">
            <button class="send-icon" onclick="sendMsg()">➤</button>
        </div>
    </div>
</div>

<script>
    let generatedOTP = null;
    let fullPhone = "";

    function sendOTP() {
        const num = document.getElementById("phoneNum").value.trim();
        const code = document.getElementById("countryCode").value;
        if(num.length < 7) {
            alert("Please enter a valid mobile number!");
            return;
        }

        fullPhone = code + num;
        generatedOTP = Math.floor(100000 + Math.random() * 900000); // 6 Digit OTP
        
        alert(`[Demo SMS Gateway]\nYour Verification Code for ${fullPhone} is: ${generatedOTP}`);
        
        document.getElementById("otpBox").style.display = "block";
        document.getElementById("sendOtpBtn").style.display = "none";
    }

    function verifyOTP() {
        const userOtp = document.getElementById("otpInput").value.trim();
        if(userOtp == generatedOTP) {
            document.getElementById("authScreen").style.display = "none";
            document.getElementById("userDisplay").innerText = fullPhone;
        } else {
            alert("Invalid OTP Code! Try again.");
        }
    }

    function sendMsg() {
        const input = document.getElementById("msgInput");
        const text = input.value.trim();
        if(!text) return;

        const body = document.getElementById("chatBody");
        const now = new Date();
        const timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

        const msgDiv = document.createElement("div");
        msgDiv.className = "msg sent";
        msgDiv.innerHTML = `${text} <div class="msg-time">${timeStr} ✓✓</div>`;

        body.appendChild(msgDiv);
        input.value = "";
        body.scrollTop = body.scrollHeight;
    }
</script>

</body>
</html>
