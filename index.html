<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Direct Live Chat</title>
    <!-- PubNub SDK for 100% Working Instant Live Chat without setup -->
    <script src="https://cdn.pubnub.com/sdk/javascript/pubnub.7.2.2.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .insta-chat-wrapper {
            width: 100%;
            max-width: 420px;
            height: 100vh;
            max-height: 850px;
            background-color: #000000;
            border: 1px solid #262626;
            display: flex;
            flex-direction: column;
            position: relative;
            border-radius: 20px;
            overflow: hidden;
        }

        /* Top Header */
        .insta-header {
            height: 60px;
            border-bottom: 1px solid #262626;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            background-color: #000000;
        }

        .user-profile-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .profile-pic {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: linear-gradient(45deg, #f09433, #dc2743, #bc1888);
            padding: 2px;
        }

        .profile-pic div {
            width: 100%;
            height: 100%;
            background: #262626;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: bold;
        }

        .username-text {
            font-size: 14px;
            font-weight: 600;
            color: #f5f5f5;
        }

        .user-status {
            font-size: 11px;
            color: #a8a8a8;
        }

        /* Username Lock Setup */
        .username-setup-bar {
            background-color: #121212;
            padding: 10px 16px;
            border-bottom: 1px solid #262626;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .username-input-group {
            display: flex;
            gap: 8px;
        }

        .username-input-group input {
            flex: 1;
            background: #262626;
            border: none;
            padding: 8px 12px;
            border-radius: 8px;
            color: #fff;
            font-size: 13px;
            outline: none;
        }

        .username-input-group button {
            background: #0095f6;
            border: none;
            color: #fff;
            font-weight: 600;
            font-size: 12px;
            padding: 0 14px;
            border-radius: 8px;
            cursor: pointer;
        }

        .lock-info-text {
            font-size: 10px;
            color: #a8a8a8;
        }

        /* Chat Scroll Area */
        .chat-messages-area {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            background-color: #000000;
        }

        .msg-row {
            display: flex;
            align-items: flex-end;
            gap: 8px;
            max-width: 75%;
        }

        .msg-row.sent {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .msg-row.received {
            align-self: flex-start;
        }

        .msg-bubble {
            padding: 10px 16px;
            border-radius: 22px;
            font-size: 14px;
            line-height: 1.4;
            word-break: break-word;
        }

        .sent .msg-bubble {
            background: linear-gradient(135deg, #a832d7, #e83377);
            color: #ffffff;
            border-bottom-right-radius: 4px;
        }

        .received .msg-bubble {
            background-color: #262626;
            color: #ffffff;
            border-bottom-left-radius: 4px;
        }

        .sender-tag {
            font-size: 10px;
            color: #a8a8a8;
            margin-bottom: 2px;
        }

        .unsend-btn {
            background: none;
            border: none;
            color: #ed4956;
            font-size: 11px;
            cursor: pointer;
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        .msg-row:hover .unsend-btn {
            opacity: 1;
        }

        /* Footer Input Bar */
        .insta-footer {
            padding: 12px 16px;
            background-color: #000000;
            border-top: 1px solid #121212;
            display: flex;
            gap: 10px;
        }

        .input-box-wrapper {
            flex: 1;
            background-color: #262626;
            border-radius: 25px;
            display: flex;
            align-items: center;
            padding: 8px 16px;
        }

        .input-box-wrapper input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: #ffffff;
            font-size: 14px;
        }

        .send-btn {
            background: none;
            border: none;
            color: #0095f6;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="insta-chat-wrapper">
    <div class="insta-header">
        <div class="user-profile-info">
            <div class="profile-pic"><div>RS</div></div>
            <div>
                <div class="username-text">rilasherif</div>
                <div class="user-status">🟢 Active Live</div>
            </div>
        </div>
    </div>

    <div class="username-setup-bar">
        <div id="usernameControlArea" class="username-input-group">
            <input type="text" id="usernameInput" placeholder="Set your username...">
            <button onclick="saveUsername()">Set</button>
        </div>
        <span id="lockTimerInfo" class="lock-info-text">Username locks for 14 days upon saving.</span>
    </div>

    <div class="chat-messages-area" id="chatMessages"></div>

    <div class="insta-footer">
        <div class="input-box-wrapper">
            <input type="text" id="messageInput" placeholder="Message..." onkeydown="if(event.key==='Enter') sendMessage()">
        </div>
        <button class="send-btn" onclick="sendMessage()">Send</button>
    </div>
</div>

<script>
    // Public Global Real-time Live Connection Keys
    const pubnub = new PubNub({
        publishKey: "pub-c-48be9f45-bb74-4b53-90d5-2e6f4770ca2b",
        subscribeKey: "sub-c-11e2f3d2-28e4-11e9-a461-1e9d1bf76292",
        userId: "user_" + Math.random().toString(36).substring(2, 9)
    });

    const channel = "rilasherif_live_chat_room";

    pubnub.subscribe({ channels: [channel] });

    let currentUsername = localStorage.getItem("insta_chat_username") || "";
    let lockTimestamp = localStorage.getItem("insta_chat_username_lock") || 0;

    // 14 Days Username Lock System
    function checkUsernameLock() {
        const now = Date.now();
        const fourteenDaysInMs = 14 * 24 * 60 * 60 * 1000;
        const timePassed = now - lockTimestamp;

        if (currentUsername && timePassed < fourteenDaysInMs) {
            const remainingDays = Math.ceil((fourteenDaysInMs - timePassed) / (1000 * 60 * 60 * 24));
            document.getElementById("usernameControlArea").innerHTML = `<span style="font-size:13px; font-weight:600; color:#fff;">User: <span style="color:#e83377;">@${currentUsername}</span></span>`;
            document.getElementById("lockTimerInfo").innerText = `🔒 Username locked for ${remainingDays} days.`;
        }
    }

    function saveUsername() {
        const inputVal = document.getElementById("usernameInput").value.trim();
        if (inputVal !== "") {
            currentUsername = inputVal;
            lockTimestamp = Date.now();
            localStorage.setItem("insta_chat_username", currentUsername);
            localStorage.setItem("insta_chat_username_lock", lockTimestamp);
            checkUsernameLock();
        }
    }

    checkUsernameLock();

    // Send Live Message
    function sendMessage() {
        if (!currentUsername) {
            alert("Please set your username first!");
            return;
        }
        const textInput = document.getElementById("messageInput");
        const msgText = textInput.value.trim();

        if (msgText !== "") {
            const msgObj = {
                id: 'msg_' + Date.now(),
                sender: currentUsername,
                text: msgText,
                action: 'CHAT'
            };

            pubnub.publish({ channel: channel, message: msgObj });
            textInput.value = "";
        }
    }

    // Unsend Message
    function unsendMessage(msgId) {
        if (confirm("Unsend message?")) {
            pubnub.publish({
                channel: channel,
                message: { id: msgId, action: 'DELETE' }
            });
        }
    }

    // Receive Realtime Live Messages Sync
    pubnub.addListener({
        message: function(event) {
            const data = event.message;
            const container = document.getElementById("chatMessages");

            if (data.action === 'DELETE') {
                const el = document.getElementById(data.id);
                if (el) el.remove();
                return;
            }

            const isMe = data.sender === currentUsername;
            const msgRow = document.createElement("div");
            msgRow.className = `msg-row ${isMe ? 'sent' : 'received'}`;
            msgRow.id = data.id;

            const unsendBtnHtml = isMe ? `<button class="unsend-btn" title="Unsend" onclick="unsendMessage('${data.id}')">Unsend</button>` : '';

            msgRow.innerHTML = `
                <div class="msg-bubble">
                    <div class="sender-tag">@${data.sender}</div>
                    <div>${data.text}</div>
                </div>
                ${unsendBtnHtml}
            `;

            container.appendChild(msgRow);
            container.scrollTop = container.scrollHeight;
        }
    });
</script>

</body>
</html>
