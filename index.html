<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Direct</title>
    <!-- PeerJS for Direct Real-Time Connection -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #000;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .insta-chat-wrapper {
            width: 100%;
            max-width: 420px;
            height: 100vh;
            max-height: 850px;
            background-color: #000;
            border: 1px solid #262626;
            display: flex;
            flex-direction: column;
            border-radius: 20px;
            overflow: hidden;
        }

        .insta-header {
            height: 60px;
            border-bottom: 1px solid #262626;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
        }

        .user-profile-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .profile-pic {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: linear-gradient(45deg, #f09433, #dc2743, #bc1888);
            padding: 2px;
        }

        .profile-pic div {
            width: 100%;
            height: 100%;
            background: #262626;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: bold;
        }

        .username-text {
            font-size: 14px;
            font-weight: 600;
        }

        .user-status {
            font-size: 11px;
            color: #a8a8a8;
        }

        /* Connection & Username Setup Panel */
        .setup-panel {
            background-color: #121212;
            padding: 12px 16px;
            border-bottom: 1px solid #262626;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .input-row {
            display: flex;
            gap: 8px;
        }

        .input-row input {
            flex: 1;
            background: #262626;
            border: none;
            padding: 8px 12px;
            border-radius: 8px;
            color: #fff;
            font-size: 13px;
            outline: none;
        }

        .input-row button {
            background: #0095f6;
            border: none;
            color: #fff;
            font-weight: 600;
            font-size: 12px;
            padding: 0 14px;
            border-radius: 8px;
            cursor: pointer;
        }

        .status-text {
            font-size: 11px;
            color: #ff7eb3;
        }

        /* Chat Scroll Area */
        .chat-messages-area {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            background-color: #000;
        }

        .msg-row {
            display: flex;
            align-items: flex-end;
            gap: 8px;
            max-width: 75%;
        }

        .msg-row.sent {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .msg-row.received {
            align-self: flex-start;
        }

        .msg-bubble {
            padding: 10px 16px;
            border-radius: 22px;
            font-size: 14px;
            line-height: 1.4;
            word-break: break-word;
        }

        .sent .msg-bubble {
            background: linear-gradient(135deg, #a832d7, #e83377);
            color: #fff;
            border-bottom-right-radius: 4px;
        }

        .received .msg-bubble {
            background-color: #262626;
            color: #fff;
            border-bottom-left-radius: 4px;
        }

        .sender-tag {
            font-size: 10px;
            color: #a8a8a8;
            margin-bottom: 2px;
        }

        .unsend-btn {
            background: none;
            border: none;
            color: #ed4956;
            font-size: 11px;
            cursor: pointer;
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        .msg-row:hover .unsend-btn {
            opacity: 1;
        }

        /* Footer Input Bar */
        .insta-footer {
            padding: 12px 16px;
            background-color: #000;
            border-top: 1px solid #121212;
            display: flex;
            gap: 10px;
        }

        .input-box-wrapper {
            flex: 1;
            background-color: #262626;
            border-radius: 25px;
            display: flex;
            align-items: center;
            padding: 8px 16px;
        }

        .input-box-wrapper input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: #fff;
            font-size: 14px;
        }

        .send-btn {
            background: none;
            border: none;
            color: #0095f6;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="insta-chat-wrapper">
    <div class="insta-header">
        <div class="user-profile-info">
            <div class="profile-pic"><div>RS</div></div>
            <div>
                <div class="username-text">rilasherif</div>
                <div class="user-status" id="liveStatus">🔴 Disconnected</div>
            </div>
        </div>
    </div>

    <!-- Setup Area -->
    <div class="setup-panel">
        <div class="input-row" id="usernameArea">
            <input type="text" id="usernameInput" placeholder="Enter Your Username...">
            <button onclick="saveUsername()">Save</button>
        </div>
        <div class="input-row">
            <input type="text" id="peerIdInput" placeholder="Paste Partner's ID to connect...">
            <button onclick="connectToPartner()">Connect</button>
        </div>
        <div class="status-text" id="myIdDisplay">My Connection ID: Creating...</div>
    </div>

    <!-- Chat Messages Container -->
    <div class="chat-messages-area" id="chatMessages"></div>

    <!-- Input Bar -->
    <div class="insta-footer">
        <div class="input-box-wrapper">
            <input type="text" id="messageInput" placeholder="Message..." onkeydown="if(event.key==='Enter') sendMessage()">
        </div>
        <button class="send-btn" onclick="sendMessage()">Send</button>
    </div>
</div>

<script>
    let peer = new Peer();
    let conn = null;
    let currentUsername = localStorage.getItem("insta_username") || "";

    // 1. Peer Setup & ID Generation
    peer.on('open', (id) => {
        document.getElementById("myIdDisplay").innerText = `Your ID: ${id} (Share this with partner)`;
    });

    // Handle Incoming Connection
    peer.on('connection', (connection) => {
        conn = connection;
        setupConnection();
    });

    // 2. Connect to Partner ID
    function connectToPartner() {
        const partnerId = document.getElementById("peerIdInput").value.trim();
        if (partnerId) {
            conn = peer.connect(partnerId);
            setupConnection();
        }
    }

    function setupConnection() {
        conn.on('open', () => {
            document.getElementById("liveStatus").innerText = "🟢 Active Now";
            document.getElementById("liveStatus").style.color = "#00ea90";
        });

        conn.on('data', (data) => {
            if (data.type === 'CHAT') {
                renderMessage(data.id, data.sender, data.text, false);
            } else if (data.type === 'DELETE') {
                const el = document.getElementById(data.id);
                if (el) el.remove();
            }
        });
    }

    // Username Save Logic
    function saveUsername() {
        const val = document.getElementById("usernameInput").value.trim();
        if (val) {
            currentUsername = val;
            localStorage.setItem("insta_username", val);
            document.getElementById("usernameArea").innerHTML = `<span style="font-weight:600; font-size:13px;">User: <span style="color:#e83377;">@${currentUsername}</span></span>`;
        }
    }

    if (currentUsername) {
        document.getElementById("usernameArea").innerHTML = `<span style="font-weight:600; font-size:13px;">User: <span style="color:#e83377;">@${currentUsername}</span></span>`;
    }

    // Send Message
    function sendMessage() {
        if (!currentUsername) {
            alert("Set your username first!");
            return;
        }
        if (!conn) {
            alert("Please connect to your partner using Connection ID first!");
            return;
        }

        const input = document.getElementById("messageInput");
        const msgText = input.value.trim();

        if (msgText !== "") {
            const msgId = 'msg_' + Date.now();
            const msgData = { type: 'CHAT', id: msgId, sender: currentUsername, text: msgText };

            conn.send(msgData);
            renderMessage(msgId, currentUsername, msgText, true);
            input.value = "";
        }
    }

    // Unsend Message
    function unsendMessage(msgId) {
        if (confirm("Unsend message?")) {
            if (conn) {
                conn.send({ type: 'DELETE', id: msgId });
            }
            const el = document.getElementById(msgId);
            if (el) el.remove();
        }
    }

    // Render Message UI
    function renderMessage(id, sender, text, isMe) {
        const container = document.getElementById("chatMessages");
        const msgRow = document.createElement("div");
        msgRow.className = `msg-row ${isMe ? 'sent' : 'received'}`;
        msgRow.id = id;

        const unsendBtnHtml = isMe ? `<button class="unsend-btn" onclick="unsendMessage('${id}')">Unsend</button>` : '';

        msgRow.innerHTML = `
            <div class="msg-bubble">
                <div class="sender-tag">@${sender}</div>
                <div>${text}</div>
            </div>
            ${unsendBtnHtml}
        `;

        container.appendChild(msgRow);
        container.scrollTop = container.scrollHeight;
    }
</script>

</body>
</html>
