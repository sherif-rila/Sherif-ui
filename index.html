<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Direct</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Firebase SDKs for Real-time Live Sync -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        /* Instagram App Frame */
        .insta-chat-wrapper {
            width: 100%;
            max-width: 450px;
            height: 100vh;
            max-height: 900px;
            background-color: #000000;
            border: 1px solid #262626;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* Instagram Top Header Bar */
        .insta-header {
            height: 60px;
            border-bottom: 1px solid #262626;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            background-color: #000000;
            z-index: 10;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .back-icon, .icon-btn {
            background: none;
            border: none;
            color: #ffffff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .user-profile-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .profile-pic {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
            padding: 2px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .profile-pic img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 2px solid #000;
            object-fit: cover;
        }

        .user-name-details {
            display: flex;
            flex-direction: column;
        }

        .username-text {
            font-size: 14px;
            font-weight: 600;
            color: #f5f5f5;
        }

        .user-status {
            font-size: 11px;
            color: #a8a8a8;
        }

        /* Username Setup Overlay Bar */
        .username-setup-bar {
            background-color: #121212;
            padding: 10px 16px;
            border-bottom: 1px solid #262626;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .username-input-group {
            display: flex;
            gap: 8px;
        }

        .username-input-group input {
            flex: 1;
            background: #262626;
            border: none;
            padding: 8px 12px;
            border-radius: 8px;
            color: #fff;
            font-size: 13px;
            outline: none;
        }

        .username-input-group button {
            background: #0095f6;
            border: none;
            color: #fff;
            font-weight: 600;
            font-size: 12px;
            padding: 0 14px;
            border-radius: 8px;
            cursor: pointer;
        }

        .lock-info-text {
            font-size: 10px;
            color: #8e8e8e;
        }

        /* Chat Messages Scroll Container */
        .chat-messages-area {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
            background-color: #000000;
        }

        /* Instagram Message Bubbles */
        .msg-row {
            display: flex;
            align-items: flex-end;
            gap: 8px;
            max-width: 75%;
            position: relative;
        }

        .msg-row.sent {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .msg-row.received {
            align-self: flex-start;
        }

        .msg-bubble {
            padding: 10px 16px;
            border-radius: 22px;
            font-size: 14px;
            line-height: 1.4;
            word-wrap: break-word;
            position: relative;
        }

        /* Sent Message: Insta Purple-Pink Gradient */
        .sent .msg-bubble {
            background: linear-gradient(135deg, #a832d7, #e83377);
            color: #ffffff;
            border-bottom-right-radius: 4px;
        }

        /* Received Message: Dark Glass Grey */
        .received .msg-bubble {
            background-color: #262626;
            color: #ffffff;
            border-bottom-left-radius: 4px;
        }

        .sender-tag {
            font-size: 10px;
            color: #a8a8a8;
            margin-bottom: 2px;
            font-weight: 500;
        }

        /* Unsend/Delete Button */
        .unsend-btn {
            background: none;
            border: none;
            color: #ed4956;
            font-size: 11px;
            cursor: pointer;
            opacity: 0;
            transition: opacity 0.2s ease;
            padding: 0 4px;
        }

        .msg-row:hover .unsend-btn {
            opacity: 1;
        }

        /* Instagram Input Footer */
        .insta-footer {
            padding: 12px 16px;
            background-color: #000000;
            border-top: 1px solid #121212;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .input-box-wrapper {
            flex: 1;
            background-color: #262626;
            border-radius: 25px;
            display: flex;
            align-items: center;
            padding: 8px 16px;
            gap: 10px;
        }

        .input-box-wrapper input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: #ffffff;
            font-size: 14px;
        }

        .input-box-wrapper input::placeholder {
            color: #8e8e8e;
        }

        .send-btn {
            background: none;
            border: none;
            color: #0095f6;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
        }

        .send-btn:disabled {
            opacity: 0.5;
            cursor: default;
        }
    </style>
</head>
<body>

<div class="insta-chat-wrapper">
    <!-- Header -->
    <div class="insta-header">
        <div class="header-left">
            <button class="back-icon">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="19" y1="12" x2="5" y2="12"></line>
                    <polyline points="12 19 5 12 12 5"></polyline>
                </svg>
            </button>
            <div class="user-profile-info">
                <div class="profile-pic">
                    <img src="https://v0.blob.com/avatar.png" alt="Profile" onerror="this.src='https://via.placeholder.com/150/d82b7d/ffffff?text=IG'">
                </div>
                <div class="user-name-details">
                    <span class="username-text">rilasherif</span>
                    <span class="user-status">Active now</span>
                </div>
            </div>
        </div>
        <button class="icon-btn">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="1"></circle>
                <circle cx="19" cy="12" r="1"></circle>
                <circle cx="5" cy="12" r="1"></circle>
            </svg>
        </button>
    </div>

    <!-- Username Setup Bar -->
    <div class="username-setup-bar">
        <div id="usernameControlArea" class="username-input-group">
            <input type="text" id="usernameInput" placeholder="Set your username...">
            <button onclick="saveUsername()">Set</button>
        </div>
        <span id="lockTimerInfo" class="lock-info-text">You can change your username after 14 days.</span>
    </div>

    <!-- Real-time Live Chat Area -->
    <div class="chat-messages-area" id="chatMessages"></div>

    <!-- Input Footer -->
    <div class="insta-footer">
        <div class="input-box-wrapper">
            <input type="text" id="messageInput" placeholder="Message..." onkeydown="if(event.key==='Enter') sendMessage()">
        </div>
        <button class="send-btn" onclick="sendMessage()">Send</button>
    </div>
</div>

<script>
    // --- FIREBASE LIVE REALTIME CHAT ENGINE ---
    const firebaseConfig = {
        databaseURL: "https://romantic-chat-demo-default-rtdb.firebaseio.com"
    };
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();
    const chatRef = database.ref("insta_direct_messages");

    let currentUsername = localStorage.getItem("insta_chat_username") || "";
    let lockTimestamp = localStorage.getItem("insta_chat_username_lock") || 0;

    // 14-Days Lock Verification
    function checkUsernameLock() {
        const now = Date.now();
        const fourteenDaysInMs = 14 * 24 * 60 * 60 * 1000;
        const timePassed = now - lockTimestamp;

        if (currentUsername && timePassed < fourteenDaysInMs) {
            const remainingDays = Math.ceil((fourteenDaysInMs - timePassed) / (1000 * 60 * 60 * 24));
            document.getElementById("usernameControlArea").innerHTML = `<span style="font-size:13px; font-weight:600; color:#fff;">Logged in as: <span style="color:#e83377;">@${currentUsername}</span></span>`;
            document.getElementById("lockTimerInfo").innerText = `🔒 Username locked for ${remainingDays} more days.`;
        } else {
            if (currentUsername) {
                document.getElementById("usernameInput").value = currentUsername;
            }
            document.getElementById("lockTimerInfo").innerText = "⚠️ You can change your username once every 14 days.";
        }
    }

    function saveUsername() {
        const inputVal = document.getElementById("usernameInput").value.trim();
        if (inputVal !== "") {
            currentUsername = inputVal;
            lockTimestamp = Date.now();
            localStorage.setItem("insta_chat_username", currentUsername);
            localStorage.setItem("insta_chat_username_lock", lockTimestamp);
            checkUsernameLock();
        }
    }

    checkUsernameLock();

    // Send Live Message
    function sendMessage() {
        if (!currentUsername) {
            alert("Please set your username first!");
            return;
        }
        const textInput = document.getElementById("messageInput");
        const msgText = textInput.value.trim();

        if (msgText !== "") {
            chatRef.push({
                sender: currentUsername,
                text: msgText,
                timestamp: Date.now()
            });
            textInput.value = "";
        }
    }

    // Unsend Message
    function unsendMessage(key) {
        if (confirm("Unsend message?")) {
            chatRef.child(key).remove();
        }
    }

    // Live Message Sync Listener
    chatRef.on("value", (snapshot) => {
        const container = document.getElementById("chatMessages");
        container.innerHTML = "";

        snapshot.forEach((childSnapshot) => {
            const key = childSnapshot.key;
            const data = childSnapshot.val();
            const isMe = data.sender === currentUsername;

            const msgRow = document.createElement("div");
            msgRow.className = `msg-row ${isMe ? 'sent' : 'received'}`;

            const unsendBtnHtml = isMe ? `<button class="unsend-btn" title="Unsend" onclick="unsendMessage('${key}')">Unsend</button>` : '';

            msgRow.innerHTML = `
                <div class="msg-bubble">
                    <div class="sender-tag">@${data.sender}</div>
                    <div>${data.text}</div>
                </div>
                ${unsendBtnHtml}
            `;

            container.appendChild(msgRow);
        });

        // Auto scroll to latest message
        container.scrollTop = container.scrollHeight;
    });
</script>

</body>
</html>
