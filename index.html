<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Direct</title>
    <!-- Free Live WebSockets Relay Engine -->
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #000;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .insta-chat-wrapper {
            width: 100%;
            max-width: 420px;
            height: 100vh;
            max-height: 850px;
            background-color: #000;
            border: 1px solid #262626;
            display: flex;
            flex-direction: column;
            border-radius: 20px;
            overflow: hidden;
        }

        .insta-header {
            height: 60px;
            border-bottom: 1px solid #262626;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
        }

        .user-profile-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .profile-pic {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: linear-gradient(45deg, #f09433, #dc2743, #bc1888);
            padding: 2px;
        }

        .profile-pic div {
            width: 100%;
            height: 100%;
            background: #262626;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: bold;
        }

        .username-text { font-size: 14px; font-weight: 600; }
        .user-status { font-size: 11px; color: #a8a8a8; }

        .username-setup-bar {
            background-color: #121212;
            padding: 10px 16px;
            border-bottom: 1px solid #262626;
            display: flex;
            gap: 8px;
        }

        .username-setup-bar input {
            flex: 1;
            background: #262626;
            border: none;
            padding: 8px 12px;
            border-radius: 8px;
            color: #fff;
            font-size: 13px;
            outline: none;
        }

        .username-setup-bar button {
            background: #0095f6;
            border: none;
            color: #fff;
            font-weight: 600;
            font-size: 12px;
            padding: 0 14px;
            border-radius: 8px;
            cursor: pointer;
        }

        .chat-messages-area {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            background-color: #000;
        }

        .msg-row {
            display: flex;
            align-items: flex-end;
            gap: 8px;
            max-width: 75%;
        }

        .msg-row.sent { align-self: flex-end; flex-direction: row-reverse; }
        .msg-row.received { align-self: flex-start; }

        .msg-bubble {
            padding: 10px 16px;
            border-radius: 22px;
            font-size: 14px;
            line-height: 1.4;
            word-break: break-word;
        }

        .sent .msg-bubble {
            background: linear-gradient(135deg, #a832d7, #e83377);
            color: #fff;
            border-bottom-right-radius: 4px;
        }

        .received .msg-bubble {
            background-color: #262626;
            color: #fff;
            border-bottom-left-radius: 4px;
        }

        .sender-tag { font-size: 10px; color: #a8a8a8; margin-bottom: 2px; }

        .unsend-btn {
            background: none;
            border: none;
            color: #ed4956;
            font-size: 11px;
            cursor: pointer;
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        .msg-row:hover .unsend-btn { opacity: 1; }

        .insta-footer {
            padding: 12px 16px;
            background-color: #000;
            border-top: 1px solid #121212;
            display: flex;
            gap: 10px;
        }

        .input-box-wrapper {
            flex: 1;
            background-color: #262626;
            border-radius: 25px;
            display: flex;
            align-items: center;
            padding: 8px 16px;
        }

        .input-box-wrapper input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: #fff;
            font-size: 14px;
        }

        .send-btn {
            background: none;
            border: none;
            color: #0095f6;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="insta-chat-wrapper">
    <div class="insta-header">
        <div class="user-profile-info">
            <div class="profile-pic"><div>RS</div></div>
            <div>
                <div class="username-text">rilasherif</div>
                <div class="user-status" id="connectionStatus">🟡 Connecting...</div>
            </div>
        </div>
    </div>

    <div class="username-setup-bar" id="userArea">
        <input type="text" id="usernameInput" placeholder="Enter Your Username...">
        <button onclick="saveUsername()">Set</button>
    </div>

    <div class="chat-messages-area" id="chatMessages"></div>

    <div class="insta-footer">
        <div class="input-box-wrapper">
            <input type="text" id="messageInput" placeholder="Message..." onkeydown="if(event.key==='Enter') sendMessage()">
        </div>
        <button class="send-btn" onclick="sendMessage()">Send</button>
    </div>
</div>

<script>
    // Free Public Global Live Server (Zero Config Needed)
    const client = mqtt.connect('wss://broker.emqx.io:8084/mqtt');
    const topic = 'rilasherif_secret_chat_room_2026';

    let currentUsername = localStorage.getItem("insta_username") || "";

    client.on('connect', () => {
        document.getElementById("connectionStatus").innerText = "🟢 Active Live";
        document.getElementById("connectionStatus").style.color = "#00ea90";
        client.subscribe(topic);
    });

    function saveUsername() {
        const val = document.getElementById("usernameInput").value.trim();
        if (val) {
            currentUsername = val;
            localStorage.setItem("insta_username", val);
            renderUsernameUI();
        }
    }

    function renderUsernameUI() {
        if (currentUsername) {
            document.getElementById("userArea").innerHTML = `<span style="font-size:13px;">Logged as: <b style="color:#e83377;">@${currentUsername}</b></span>`;
        }
    }

    renderUsernameUI();

    function sendMessage() {
        if (!currentUsername) {
            alert("Enter your username first!");
            return;
        }

        const input = document.getElementById("messageInput");
        const msgText = input.value.trim();

        if (msgText !== "") {
            const payload = JSON.stringify({
                id: 'msg_' + Date.now() + Math.random().toString(36).substr(2, 4),
                sender: currentUsername,
                text: msgText,
                action: 'CHAT'
            });

            client.publish(topic, payload);
            input.value = "";
        }
    }

    function unsendMessage(id) {
        if (confirm("Unsend message?")) {
            const payload = JSON.stringify({ id: id, action: 'DELETE' });
            client.publish(topic, payload);
        }
    }

    // Receive Real-time Live Messages
    client.on('message', (topic, message) => {
        const data = JSON.parse(message.toString());
        const container = document.getElementById("chatMessages");

        if (data.action === 'DELETE') {
            const el = document.getElementById(data.id);
            if (el) el.remove();
            return;
        }

        const isMe = data.sender === currentUsername;
        const msgRow = document.createElement("div");
        msgRow.className = `msg-row ${isMe ? 'sent' : 'received'}`;
        msgRow.id = data.id;

        const unsendBtnHtml = isMe ? `<button class="unsend-btn" onclick="unsendMessage('${data.id}')">Unsend</button>` : '';

        msgRow.innerHTML = `
            <div class="msg-bubble">
                <div class="sender-tag">@${data.sender}</div>
                <div>${data.text}</div>
            </div>
            ${unsendBtnHtml}
        `;

        container.appendChild(msgRow);
        container.scrollTop = container.scrollHeight;
    });
</script>

</body>
</html>
